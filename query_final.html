    "入网一码通": ""
  }
];
// ========== 数据区域结束 ==========
function getQueryParam(name){
  var url = window.location.href;
  var idx = url.indexOf('?');
  if(idx < 0) return '';
  var params = url.substring(idx+1).split('&');
  for(var i=0;i<params.length;i++){
    var pair = params[i].split('=');
    if(decodeURIComponent(pair[0]) === name){
      return decodeURIComponent(pair[1]||'');
    }
  }
  return '';
}
function renderRow(label, value){
  return '<div class="table-row"><div class="label-col">'+label+'</div><div class="val-col">'+(value||'')+'</div></div>';
}
function render(){
  var id = getQueryParam('id') || getQueryParam('code') || getQueryParam('编号');
  var box = document.getElementById('content');
  if(!id){
    box.innerHTML = '<div class="not-found">请通过工器具标签二维码扫码访问</div>';
    return;
  }
  var item = null;
  for(var i=0;i<TOOL_DATA.length;i++){
    if(TOOL_DATA[i].id === id || TOOL_DATA[i].编号 === id){
      item = TOOL_DATA[i];
      break;
    }
  }
  if(!item){
    box.innerHTML = '<div class="not-found">未找到编号为 '+id+' 的工器具信息</div>';
    return;
  }
  var html = '<div class="table-box">';
  html += renderRow('送检单位', item.送检单位);
  html += renderRow('名称', item.名称);
  html += renderRow('型号/规格', item.型号规格);
  html += renderRow('编号', item.编号);
  html += renderRow('试验人员', item.试验人员);
  html += renderRow('试验日期', item.试验日期);
  html += renderRow('下次试验日期', item.下次试验日期);
  html += renderRow('入网一码通', item.入网一码通);
  html += '</div>';
  box.innerHTML = html;
}
render();
</script>
</body>
</html>
